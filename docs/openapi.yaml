openapi: 3.1.0
# docs/openapi.yaml v5.2.61
# HanziMaster HTTP API 的机器可读规范（唯一权威源；04-api-reference.md §10 为文字镜像）
info:
  title: HanziMaster HTTP API
  version: 5.2.61
  summary: 汉字学习应用的部署探针、可选云端进度同步与 GEO 事实摘要端点
  description: |
    本 API 只有 3 个公开 HTTP 端点，均无用户账户体系。

    - 鉴权模型：`/api/progress` 使用 **同步码（sync code）** 作为能力凭证，
      32 位小写十六进制字符串，**只能放在 POST JSON 请求体中**。
      任何持有同步码者可读取或覆盖对应备份，等同于密码，禁止写入 URL、日志或仓库。
    - 版本与错误码：`message` 为面向开发者的英文固定文案；客户端应依据 `error` 字段分支，
      不要解析 `message`。错误码定义见 `components/schemas/ErrorCode`。
    - 缓存：所有端点返回 `Cache-Control: no-store`。
    - 限流：`/api/progress` 为每同步码 30 次/分钟（进程内尽力而为实现，多实例下为 N 倍）。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://hanzi.ewuse.com
    description: 生产环境（正式域名）
  - url: http://localhost:3000
    description: 本地开发

tags:
  - name: Operations
    description: 部署健康探针
  - name: Progress Sync
    description: 可选云端进度同步（依赖 Vercel Blob 私有 store）
  - name: Discovery
    description: 生成式引擎可抓取的事实摘要

paths:
  /api/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: 部署健康探针
      description: 恒定返回 200，用于验证构建版本与运行时可达性；无鉴权、无副作用、无错误分支。
      responses:
        '200':
          description: 服务正常
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              examples:
                healthy:
                  value:
                    status: ok
                    version: 5.2.61
                    build: '2611231000'
                    timestamp: '2026-11-23T02:00:00.000Z'

  /api/progress:
    get:
      tags: [Progress Sync]
      operationId: getProgressLegacy
      summary: 已关闭的旧读取通道
      description: |
        旧版 `GET /api/progress?code=...` 已永久关闭，防止能力凭证落入服务器/CDN 访问日志。
        任何 GET 请求均返回 405 `use_post`；请改用 POST（省略 `backup` 即为读取）。
      responses:
        '405':
          description: 通道已关闭，请使用 POST
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: use_post, message: 'Cloud sync request failed' }
    post:
      tags: [Progress Sync]
      operationId: syncProgress
      summary: 读取或写入云端进度备份
      description: |
        `backup` 省略时读取，`backup` 为非空字符串时写入（覆盖）。
        `backup` 是 `createProgressBackup()` 返回的 **JSON 字符串**，不是 JSON 对象。
        同步码只从请求体读取，不进 query/path/header。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ProgressReadRequest'
                - $ref: '#/components/schemas/ProgressWriteRequest'
            examples:
              read:
                summary: 读取备份
                value: { code: 9f2c1a0b7d6e4f385a2b1c0d9e8f7a6b }
              write:
                summary: 写入备份
                value:
                  code: 9f2c1a0b7d6e4f385a2b1c0d9e8f7a6b
                  backup: '{"version":1,"exportedAt":"2026-11-23T02:00:00.000Z","progress":{}}'
      responses:
        '200':
          description: 读取或写入成功（响应结构取决于请求是否携带 `backup`）
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProgressReadResponse'
                  - $ref: '#/components/schemas/ProgressWriteResponse'
        '400':
          description: 请求体或同步码非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 该同步码没有云端备份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: 备份超过体积上限（4 MB）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: 触发限流
          headers:
            Retry-After:
              schema: { type: string, const: '60' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: 云端读写失败或拒绝写入空进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: 未配置 Blob 凭证，云同步不可用（客户端应降级为纯本地进度）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /llms.txt:
    get:
      tags: [Discovery]
      operationId: getLlmsTxt
      summary: 生成式引擎事实摘要
      description: 静态生成的纯文本事实清单，说明产品无需注册、无 AI 后端、无账户体系。
      responses:
        '200':
          description: 纯文本事实摘要
          content:
            text/plain:
              schema: { type: string }

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, build, timestamp]
      properties:
        status: { type: string, const: ok }
        version: { type: string, description: 构建期注入的 NEXT_PUBLIC_APP_VERSION，缺失为 unknown }
        build: { type: string, description: 构建期注入的 NEXT_PUBLIC_BUILD_ID，缺失为 unknown }
        timestamp: { type: string, format: date-time }

    ProgressReadRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/SyncCode' }
        backup:
          description: 读取时必须省略
          not: {}

    ProgressWriteRequest:
      type: object
      additionalProperties: false
      required: [code, backup]
      properties:
        code: { $ref: '#/components/schemas/SyncCode' }
        backup:
          type: string
          minLength: 1
          maxLength: 4194304
          description: createProgressBackup() 返回的 JSON 字符串（UTF-8 不超过 4 MB）

    SyncCode:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: 32 位小写十六进制能力凭证，等同于密码

    ProgressReadResponse:
      type: object
      additionalProperties: false
      required: [backup]
      properties:
        backup: { type: string, description: 备份 JSON 字符串，交给 parseProgressBackup() 解析 }

    ProgressWriteResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: 面向开发者的英文固定文案，客户端不应解析此字段 }

    ErrorCode:
      type: string
      description: |
        统一错误码。`not_configured` / `invalid_json` / `use_post` 由路由层返回，暂无专用 message 映射，
        走 fallback `Cloud sync request failed`（已知缺口，见 docs/10-optimization-roadmap.md OPT-12）。
      enum:
        - not_configured
        - invalid_json
        - invalid_code
        - invalid_backup
        - rate_limited
        - not_found
        - too_large
        - empty_backup
        - empty_progress
        - read_failed
        - write_failed
        - use_post
